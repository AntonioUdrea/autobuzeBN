<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Istoric vehicul - Bistrița Bus Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    header a {
      color: white;
    }

    main {
      overflow: auto;
      padding: 12px 16px;
    }

    select {
      max-width: 100%;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 900px;
    }

    th,
    td {
      text-align: left;
      vertical-align: top;
      padding: 6px 10px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }

    th {
      background: #f2f2f2;
    }

    td.muted,
    .muted {
      color: #999;
    }

    a.route {
      text-decoration: none;
    }

    a.route:hover {
      background: #bbdefb;
    }

    .route {
      display: inline-block;
      min-width: 1.6em;
      padding: 0 6px;
      border-radius: 4px;
      background: #e3f2fd;
      color: #0d47a1;
      font-weight: bold;
      text-align: center;
    }

    .stint {
      white-space: nowrap;
    }

  </style>
</head>

<body>

  <header>
    <h1>Istoric vehicul</h1>

    <div class="controls">
      <a href="last-seen.html">&larr; Văzut ultima dată</a>
      <select id="vehicle"></select>
    </div>

    <div id="status">Se încarcă...</div>
  </header>

  <main>
    <table id="daysTable" hidden>
      <thead>
        <tr>
          <th>Data</th>
          <th>Văzut</th>
          <th>Rute</th>
        </tr>
      </thead>
      <tbody id="days"></tbody>
    </table>
  </main>

  <script src="common.js"></script>
  <script>
    const { OPERATOR_NAMES, escapeHtml, naturalCompare } = Common;

    const el = id => document.getElementById(id);

    // "operator:id" -> Map(date -> stints[])
    // stint = { route, from, to, polls, directions }; old imported rows only have { route }
    const visits = new Map();
    let vehicles = {};

    async function getJson(url, fallback) {
      try {
        const r = await fetch(url, { cache: "no-store" });
        return r.ok ? await r.json() : fallback;
      } catch {
        return fallback;
      }
    }

    // ---------- formatting ----------

    function label(key) {
      const [operator, id] = key.split(":");
      const info = vehicles[operator]?.[id];
      return `${OPERATOR_NAMES[operator] ?? operator} - ${info?.licensePlate ?? "Număr necunoscut"} ` +
        `(ID ${id}${info?.model ? ", " + info.model : ""})`;
    }

    function weekday(date) {
      return new Date(`${date}T12:00:00Z`).toLocaleDateString("ro-RO", { weekday: "short", timeZone: "UTC" });
    }

    function routeBadge(route) {
      return `<a class="route" href="route-history.html?route=${encodeURIComponent(route)}" title="Istoricul rutei ${escapeHtml(route)}">${escapeHtml(route)}</a>`;
    }

    // ---------- rendering ----------

    function stintHtml(s) {
      const time = !s.from ? `<span class="muted">fără oră înregistrată</span>`
        : s.from === s.to ? escapeHtml(s.from)
        : `${escapeHtml(s.from)}&ndash;${escapeHtml(s.to)}`;

      const directions = s.directions?.length
        ? ` <span class="muted">&rarr; ${escapeHtml(s.directions.join(" / "))}</span>`
        : "";

      return `<div class="stint">${time} ${routeBadge(s.route)}${directions}</div>`;
    }

    function render() {
      const days = visits.get(el("vehicle").value);
      if (!days) return;

      const dates = [...days.keys()].sort();

      el("days").innerHTML = [...dates].reverse().map(date => {
        const stints = days.get(date);
        const timed = stints.filter(x => x.from && x.to);
        const span = timed.length ? `${timed[0].from}&ndash;${timed[timed.length - 1].to}` : `<span class="muted">-</span>`;

        return `<tr>
          <td>${escapeHtml(date)} <span class="muted">${weekday(date)}</span></td>
          <td>${span}</td>
          <td>${stints.map(stintHtml).join("")}</td>
        </tr>`;
      }).join("");

      el("daysTable").hidden = false;

      const n = dates.length;
      el("status").textContent =
        `Văzut ${n === 1 ? "într-o zi" : `în ${n} ${n >= 20 ? "de " : ""}zile`} (prima dată: ${dates[0]}, ultima dată: ${dates[n - 1]})`;
    }

    // ---------- loading ----------

    async function load() {
      const [index, vehiclesData] = await Promise.all([
        getJson("data/history/index.json", { months: [] }),
        getJson("data/vehicles.json", {})
      ]);
      vehicles = vehiclesData;

      const months = await Promise.all((index.months ?? []).map(m => getJson(`data/history/${m}.json`, {})));

      for (const month of months) {
        for (const [date, dayVehicles] of Object.entries(month)) {
          for (const [key, stints] of Object.entries(dayVehicles)) {
            if (!visits.has(key)) visits.set(key, new Map());
            visits.get(key).set(date, stints);
          }
        }
      }

      const keys = [...visits.keys()].sort((a, b) => naturalCompare(label(a), label(b)));

      if (keys.length === 0) {
        el("status").textContent = "Nu există încă istoric. Primele înregistrări apar după următoarea verificare.";
        return;
      }

      el("vehicle").innerHTML = keys.map(k =>
        `<option value="${escapeHtml(k)}">${escapeHtml(label(k))}</option>`).join("");

      const params = new URLSearchParams(location.search);
      const wanted = `${params.get("operator")}:${params.get("id")}`;
      if (visits.has(wanted)) el("vehicle").value = wanted;

      render();
    }

    el("vehicle").addEventListener("change", render);
    load();
  </script>

</body>

</html>
