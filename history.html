<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle history - Bistrița Bus Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    header a {
      color: white;
    }

    main {
      overflow: auto;
      padding: 12px 16px;
    }

    select {
      max-width: 100%;
    }

    h2 {
      font-size: 16px;
      margin: 20px 0 8px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      max-width: 900px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 8px 10px;
    }

    .card .label {
      font-size: 12px;
      color: #666;
    }

    .card .value {
      font-size: 18px;
      font-weight: bold;
    }

    .card .note {
      font-size: 12px;
      color: #999;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 900px;
    }

    th,
    td {
      text-align: left;
      vertical-align: top;
      padding: 6px 10px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }

    th {
      background: #f2f2f2;
    }

    td.muted,
    .muted {
      color: #999;
    }

    .route {
      display: inline-block;
      min-width: 1.6em;
      padding: 0 6px;
      border-radius: 4px;
      background: #e3f2fd;
      color: #0d47a1;
      font-weight: bold;
      text-align: center;
    }

    .stint {
      white-space: nowrap;
    }

    .bar {
      display: inline-block;
      height: 8px;
      background: #1565c0;
      border-radius: 4px;
      vertical-align: middle;
    }
  </style>
</head>

<body>

  <header>
    <h1>Vehicle history</h1>

    <div class="controls">
      <a href="last-seen.html">&larr; Last seen</a>
      <select id="vehicle"></select>
    </div>

    <div id="status">Loading...</div>
  </header>

  <main>
    <div id="summary" class="cards"></div>

    <h2 id="routesTitle" hidden>Routes</h2>
    <table id="routesTable" hidden>
      <thead>
        <tr>
          <th>Route</th>
          <th>Days</th>
          <th>Share of days</th>
          <th>Last on this route</th>
        </tr>
      </thead>
      <tbody id="routes"></tbody>
    </table>

    <h2 id="daysTitle" hidden>Day by day</h2>
    <table id="daysTable" hidden>
      <thead>
        <tr>
          <th>Date</th>
          <th>Seen</th>
          <th>Routes</th>
        </tr>
      </thead>
      <tbody id="days"></tbody>
    </table>
  </main>

  <script src="common.js"></script>
  <script>
    const { OPERATOR_NAMES, escapeHtml, naturalCompare, toMinutes, bucharestDate } = Common;

    const el = id => document.getElementById(id);

    // "operator:id" -> Map(date -> stints[])
    // stint = { route, from, to, polls, directions }; old imported rows only have { route }
    const visits = new Map();
    let vehicles = {};

    async function getJson(url, fallback) {
      try {
        const r = await fetch(url, { cache: "no-store" });
        return r.ok ? await r.json() : fallback;
      } catch {
        return fallback;
      }
    }

    // ---------- formatting ----------

    function label(key) {
      const [operator, id] = key.split(":");
      const info = vehicles[operator]?.[id];
      return `${OPERATOR_NAMES[operator] ?? operator} - ${info?.licensePlate ?? "Unknown plate"} ` +
        `(ID ${id}${info?.model ? ", " + info.model : ""})`;
    }

    function hhmm(minutes) {
      const m = Math.round(minutes);
      return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
    }

    function duration(minutes) {
      const h = Math.floor(minutes / 60);
      const m = Math.round(minutes % 60);
      return h ? `${h} h ${m} min` : `${m} min`;
    }

    function weekday(date) {
      return new Date(`${date}T12:00:00Z`).toLocaleDateString("en-GB", { weekday: "short", timeZone: "UTC" });
    }

    function daysAgo(date) {
      return Math.round((Date.parse(bucharestDate()) - Date.parse(date)) / 86400000);
    }

    function median(numbers) {
      if (!numbers.length) return null;
      const sorted = [...numbers].sort((a, b) => a - b);
      const mid = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    }

    // ---------- statistics for one vehicle ----------

    function summarize(days) {
      const dates = [...days.keys()].sort();
      const routes = new Map(); // route -> { days, last }
      const firstSeen = [];
      const lastSeen = [];
      let recordedMinutes = 0;
      let seenLast30 = 0;

      for (const date of dates) {
        const stints = days.get(date);
        if (daysAgo(date) < 30) seenLast30++;

        for (const route of new Set(stints.map(s => s.route))) {
          const r = routes.get(route) ?? { days: 0, last: "" };
          r.days++;
          r.last = date;            // dates are sorted, so the last write is the latest
          routes.set(route, r);
        }

        const timed = stints.filter(s => s.from && s.to);
        if (timed.length) {
          firstSeen.push(toMinutes(timed[0].from));
          lastSeen.push(toMinutes(timed[timed.length - 1].to));
          for (const s of timed) recordedMinutes += toMinutes(s.to) - toMinutes(s.from);
        }
      }

      return {
        dates,
        routes: [...routes.entries()].sort((a, b) => b[1].days - a[1].days),
        typicalStart: median(firstSeen),
        typicalEnd: median(lastSeen),
        timedDays: firstSeen.length,
        recordedMinutes,
        seenLast30
      };
    }

    // ---------- rendering ----------

    function card(labelText, value, note = "") {
      return `<div class="card"><div class="label">${escapeHtml(labelText)}</div>` +
        `<div class="value">${escapeHtml(value)}</div>` +
        (note ? `<div class="note">${escapeHtml(note)}</div>` : "") + `</div>`;
    }

    function stintHtml(s) {
      const time = !s.from ? `<span class="muted">no time recorded</span>`
        : s.from === s.to ? escapeHtml(s.from)
        : `${escapeHtml(s.from)}&ndash;${escapeHtml(s.to)}`;

      const directions = s.directions?.length
        ? ` <span class="muted">&rarr; ${escapeHtml(s.directions.join(" / "))}</span>`
        : "";

      return `<div class="stint">${time} <span class="route">${escapeHtml(s.route)}</span>${directions}</div>`;
    }

    function render() {
      const days = visits.get(el("vehicle").value);
      if (!days) return;

      const s = summarize(days);
      const first = s.dates[0];
      const latest = s.dates[s.dates.length - 1];
      const ago = daysAgo(latest);

      el("summary").innerHTML = [
        card("Last seen", latest, ago === 0 ? "today" : `${ago} day${ago === 1 ? "" : "s"} ago`),
        card("First recorded", first),
        card("Days seen", String(s.dates.length), `${s.seenLast30} in the last 30 days`),
        card("Usually first seen", s.typicalStart == null ? "-" : hhmm(s.typicalStart),
          s.timedDays ? `median of ${s.timedDays} days` : "no times recorded yet"),
        card("Usually last seen", s.typicalEnd == null ? "-" : hhmm(s.typicalEnd)),
        card("Time on route", s.recordedMinutes ? duration(s.recordedMinutes) : "-", "approximate, from the checks")
      ].join("");

      el("routes").innerHTML = s.routes.map(([route, r]) => {
        const share = Math.round(100 * r.days / s.dates.length);
        return `<tr>
          <td><span class="route">${escapeHtml(route)}</span></td>
          <td>${r.days}</td>
          <td><span class="bar" style="width:${share}px"></span> ${share}%</td>
          <td>${escapeHtml(r.last)}</td>
        </tr>`;
      }).join("");

      el("days").innerHTML = [...s.dates].reverse().map(date => {
        const stints = days.get(date);
        const timed = stints.filter(x => x.from && x.to);
        const span = timed.length ? `${timed[0].from}&ndash;${timed[timed.length - 1].to}` : `<span class="muted">-</span>`;

        return `<tr>
          <td>${escapeHtml(date)} <span class="muted">${weekday(date)}</span></td>
          <td>${span}</td>
          <td>${stints.map(stintHtml).join("")}</td>
        </tr>`;
      }).join("");

      for (const id of ["routesTitle", "routesTable", "daysTitle", "daysTable"]) el(id).hidden = false;

      el("status").textContent =
        `Seen on ${s.dates.length} day${s.dates.length === 1 ? "" : "s"} (first: ${first}, latest: ${latest})`;
    }

    // ---------- loading ----------

    async function load() {
      const [index, vehiclesData] = await Promise.all([
        getJson("data/history/index.json", { months: [] }),
        getJson("data/vehicles.json", {})
      ]);
      vehicles = vehiclesData;

      const months = await Promise.all((index.months ?? []).map(m => getJson(`data/history/${m}.json`, {})));

      for (const month of months) {
        for (const [date, dayVehicles] of Object.entries(month)) {
          for (const [key, stints] of Object.entries(dayVehicles)) {
            if (!visits.has(key)) visits.set(key, new Map());
            visits.get(key).set(date, stints);
          }
        }
      }

      const keys = [...visits.keys()].sort((a, b) => naturalCompare(label(a), label(b)));

      if (keys.length === 0) {
        el("status").textContent = "No history recorded yet. The first entries appear after the next check runs.";
        return;
      }

      el("vehicle").innerHTML = keys.map(k =>
        `<option value="${escapeHtml(k)}">${escapeHtml(label(k))}</option>`).join("");

      const params = new URLSearchParams(location.search);
      const wanted = `${params.get("operator")}:${params.get("id")}`;
      if (visits.has(wanted)) el("vehicle").value = wanted;

      render();
    }

    el("vehicle").addEventListener("change", render);
    load();
  </script>

</body>

</html>
