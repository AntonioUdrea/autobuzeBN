name: Check Rare Buses

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rare-bus-check
  cancel-in-progress: false

jobs:
  check-buses:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Rare Bus Checker Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node check-buses.js
