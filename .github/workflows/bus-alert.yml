name: Check Rare Buses

on:
  schedule:
    # Runs every 10 minutes between 02:00 UTC and 19:59 UTC
    # (Matches ~05:00 AM to ~10:59 PM Romania local time)
    - cron: '3,13,23,33,43,53 2-19 * * *'
  workflow_dispatch:

jobs:
  check-buses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Rare Bus Checker Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node check-buses.js
