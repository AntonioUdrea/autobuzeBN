<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route list - Bistrița Bus Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    header a {
      color: white;
    }

    main {
      overflow: auto;
      padding: 12px 16px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 900px;
    }

    th,
    td {
      text-align: left;
      padding: 6px 10px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
      white-space: nowrap;
    }

    th {
      cursor: pointer;
      position: sticky;
      top: 0;
      background: #f2f2f2;
      user-select: none;
    }

    td.muted {
      color: #999;
    }

    td.late {
      color: #c62828;
      font-weight: bold;
    }

    td.early {
      color: #1565c0;
      font-weight: bold;
    }

    td.ontime {
      color: #2e7d32;
      font-weight: bold;
    }

    #empty {
      padding: 16px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>Route list</h1>

    <div class="controls">
      <a href="index.html">&larr; Map</a>

      <select id="routeFilter">
        <option value="">Choose a route</option>
      </select>

      <button id="refreshButton">Refresh</button>
    </div>

    <div id="status">Loading...</div>
  </header>

  <main>
    <div id="empty">Choose a route to see its buses.</div>

    <table id="table" hidden>
      <thead>
        <tr>
          <th data-key="delay">Delay</th>
          <th data-key="plate">Plate</th>
          <th data-key="id">ID</th>
          <th data-key="model">Model</th>
          <th data-key="direction">Direction</th>
          <th data-key="stop">Stop</th>
          <th data-key="arrival">Arrives</th>
          <th data-key="operator">Operator</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>

  <script src="common.js"></script>
  <script>
    const {
      API_URLS, escapeHtml, naturalCompare, describeDelay, formatTime,
      loadLocalData, fetchAllVehicles, fetchStops, enrichVehicle
    } = Common;

    const REFRESH_MS = 10000;

    const ctx = { vehicles: {}, routes: {}, stops: {}, patterns: {} };
    let buses = [];
    let sortKey = "delay";
    let sortDir = -1; // most late first
    let isRefreshing = false;
    let refreshTimer = null;

    const el = id => document.getElementById(id);

    // Turns an enriched vehicle into the plain values this table shows and sorts by
    function toRow(v) {
      const stop = !v.stopName ? ""
        : v.stopStatus === "STOPPED_AT" ? `At ${v.stopName}`
        : v.stopStatus === "INCOMING_AT" ? `Arriving at ${v.stopName}`
        : `Next: ${v.stopName}`;

      return {
        operator: v.operator,
        operatorName: v.operatorName,
        routeKey: v.routeKey,
        routeLabel: v.routeIndicative,
        id: v.id,
        plate: v.licensePlate,
        model: v.model,
        direction: v.direction,
        stop,
        arrival: v.nextStopArrival ?? "",
        delay: Number(v.delaySeconds ?? 0)
      };
    }

    function delayCell(seconds) {
      const { kind, minutes } = describeDelay(seconds);
      if (kind === "late") return { text: `${minutes} min late`, cls: "late" };
      if (kind === "early") return { text: `${minutes} min early`, cls: "early" };
      return { text: "On time", cls: "ontime" };
    }

    async function refresh() {
      if (isRefreshing) return;
      isRefreshing = true;
      el("status").textContent = "Updating...";

      try {
        const { buses: fetched, failed } = await fetchAllVehicles();
        buses = fetched.map(b => toRow(enrichVehicle(b, ctx)));
        updateRouteFilter();
        render(failed);
      } finally {
        isRefreshing = false;
      }
    }

    // The 10 second refresh only rebuilds the dropdown when its options changed,
    // so an open dropdown doesn't close under your finger.
    function updateRouteFilter() {
      const select = el("routeFilter");
      const previous = select.value || new URLSearchParams(location.search).get("route") || "";

      const routes = new Map();
      for (const b of buses) {
        if (!routes.has(b.routeKey)) {
          routes.set(b.routeKey, { value: b.routeKey, label: `${b.routeLabel} (${b.operatorName})` });
        }
      }

      const options = [...routes.values()].sort((a, b) => naturalCompare(a.label, b.label));

      // Keep the selection even if the route has no buses right now
      if (previous && !routes.has(previous)) {
        const [operator, routeId] = previous.split("|");
        const label = ctx.routes[operator]?.[routeId]?.indicative ?? routeId;
        options.push({ value: previous, label: `${label} (no buses now)` });
      }

      const signature = JSON.stringify(options);
      if (select.dataset.signature !== signature) {
        select.replaceChildren(
          new Option("Choose a route", ""),
          ...options.map(o => new Option(o.label, o.value))
        );
        select.dataset.signature = signature;
      }

      select.value = previous;
    }

    function compare(a, b) {
      let x, y;
      if (sortKey === "delay") { x = a.delay; y = b.delay; }
      else if (sortKey === "id") { x = Number(a.id); y = Number(b.id); }
      else { x = String(a[sortKey]).toLowerCase(); y = String(b[sortKey]).toLowerCase(); }
      if (x < y) return -1 * sortDir;
      if (x > y) return 1 * sortDir;
      return 0;
    }

    function render(failed = []) {
      const route = el("routeFilter").value;
      const time = new Date().toLocaleTimeString();
      const warning = failed.length ? ` • Could not load: ${failed.join(", ")}` : "";

      if (!route) {
        el("table").hidden = true;
        el("empty").hidden = false;
        el("empty").textContent = "Choose a route to see its buses.";
        el("status").textContent = `${buses.length} buses running • Last update: ${time}${warning}`;
        return;
      }

      const shown = buses.filter(b => b.routeKey === route).sort(compare);

      if (shown.length === 0) {
        el("table").hidden = true;
        el("empty").hidden = false;
        el("empty").textContent = "No buses are running on this route right now.";
        el("status").textContent = `0 buses • Last update: ${time}${warning}`;
        return;
      }

      el("empty").hidden = true;
      el("table").hidden = false;

      el("rows").innerHTML = shown.map(b => {
        const d = delayCell(b.delay);
        return `<tr>
          <td class="${d.cls}">${escapeHtml(d.text)}</td>
          <td class="${b.plate === "Unknown" ? "muted" : ""}">${escapeHtml(b.plate)}</td>
          <td><a href="history.html?operator=${encodeURIComponent(b.operator)}&id=${encodeURIComponent(b.id)}">${escapeHtml(b.id)}</a></td>
          <td class="${b.model === "Unknown" ? "muted" : ""}">${escapeHtml(b.model)}</td>
          <td class="${b.direction === "Unknown" ? "muted" : ""}">${escapeHtml(b.direction)}</td>
          <td class="${b.stop ? "" : "muted"}">${escapeHtml(b.stop || "Unknown")}</td>
          <td>${escapeHtml(formatTime(b.arrival))}</td>
          <td>${escapeHtml(b.operatorName)}</td>
        </tr>`;
      }).join("");

      document.querySelectorAll("th").forEach(th => {
        const label = th.textContent.replace(/ [▲▼]$/, "");
        th.textContent = th.dataset.key === sortKey
          ? `${label} ${sortDir === 1 ? "▲" : "▼"}`
          : label;
      });

      el("status").textContent = `${shown.length} bus${shown.length === 1 ? "" : "es"} on this route • Last update: ${time}${warning}`;
    }

    async function refreshLoop() {
      clearTimeout(refreshTimer);
      if (!document.hidden) await refresh();
      refreshTimer = setTimeout(refreshLoop, REFRESH_MS);
    }

    document.querySelectorAll("th").forEach(th => {
      th.addEventListener("click", () => {
        if (sortKey === th.dataset.key) {
          sortDir = -sortDir;
        } else {
          sortKey = th.dataset.key;
          sortDir = th.dataset.key === "delay" ? -1 : 1;
        }
        render();
      });
    });

    el("routeFilter").addEventListener("change", () => {
      const url = new URL(location.href);
      if (el("routeFilter").value) url.searchParams.set("route", el("routeFilter").value);
      else url.searchParams.delete("route");
      history.replaceState(null, "", url);
      render();
    });

    el("refreshButton").addEventListener("click", refreshLoop);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refreshLoop();
    });

    (async function start() {
      try {
        const [local, stopData] = await Promise.all([loadLocalData(), fetchStops()]);
        Object.assign(ctx, local, stopData);
        await refreshLoop();
      } catch (error) {
        console.error(error);
        el("status").textContent = `Startup error: ${error.message}`;
      }
    })();
  </script>

</body>

</html>
